services:
  plugin.manager.shield.condition:
    class: Drupal\shield\ShieldConditionPluginManager
    parent: default_plugin_manager

  plugin.manager.shield.credential_provider:
    class: Drupal\shield\ShieldCredentialProviderPluginManager
    parent: default_plugin_manager

  logger.channel.shield:
    parent: logger.channel_base
    arguments: ['shield']

  shield.response_subscriber:
    class: Drupal\shield\EventSubscriber\ShieldResponseSubscriber
    arguments: ['@config.factory']
    tags:
      - { name: event_subscriber }

  shield.policy_subscriber:
    class: Drupal\shield\EventSubscriber\ShieldPolicySubscriber
    arguments: ['@entity_type.manager', '@config.factory', '@logger.channel.shield', '@module_handler', '@page_cache_kill_switch', '@request_stack']
    tags:
      - { name: event_subscriber }
