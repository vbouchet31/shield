# Schema for the configuration files of the shield module.

shield.settings:
  type: config_object
  label: 'Shield settings'
  mapping:
    shield_enable:
      type: boolean
      label: 'Enable Shield'
    allow_cli:
      type: boolean
      label: 'CLI bypass'
    debug_header:
      type: boolean
      label: 'Add a custom header in response to indicate shield status.'
    log_authentication:
      type: boolean
      label: 'Log successful Shield authentications.'
    unset_basic_auth_headers:
      type: boolean
      label: 'Unset basic_auth headers to avoid conflicts.'
    basic_auth_bypass:
      type: boolean
      label: 'Let requests authenticated by basic_auth pass Shield.'

shield.shield_policy.*:
  type: config_entity
  label: 'Shield policy'
  mapping:
    id:
      type: string
      label: 'ID'
    label:
      type: label
      label: 'Label'
    status:
      type: boolean
      label: 'Status'
    weight:
      type: integer
      label: 'Weight'
    conditions:
      type: sequence
      label: 'Conditions'
      sequence:
        type: shield.condition.plugin.[id]
    credential_providers:
      type: sequence
      label: 'Credential providers'
      sequence:
        type: shield.credential_provider.plugin.[id]

# Fallback for condition plugins that don't define their own settings.
shield.condition.plugin.*:
  type: mapping
  mapping:
    id:
      type: string
      label: 'Plugin ID'
      constraints:
        PluginExists:
          manager: plugin.manager.shield.condition
          interface: 'Drupal\shield\ShieldConditionInterface'
    negate:
      type: boolean
      label: 'Negate'

# Fallback for credential provider plugins that don't define their own
# settings.
shield.credential_provider.plugin.*:
  type: mapping
  mapping:
    id:
      type: string
      label: 'Plugin ID'
      constraints:
        PluginExists:
          manager: plugin.manager.shield.credential_provider
          interface: 'Drupal\shield\ShieldCredentialProviderInterface'
